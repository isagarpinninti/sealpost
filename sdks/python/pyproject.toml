[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sealpost"
version = "0.1.0"
description = "Zero-dependency Python client for the self-hosted Sealpost email API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Sagar Pinninti" }]
keywords = ["email", "smtp", "transactional-email", "webhooks", "sealpost", "self-hosted", "resend-alternative"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/isagarpinninti/sealpost"
Issues = "https://github.com/isagarpinninti/sealpost/issues"

[tool.setuptools.packages.find]
where = ["src"]
